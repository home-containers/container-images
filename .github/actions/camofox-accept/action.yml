name: Accept native Camofox source build
description: Identical fail-closed acceptance for verification and publication
runs:
  using: composite
  steps:
    - name: Test all Camofox helper logic without containers
      shell: bash
      run: |
        set -euo pipefail
        python3 -I -m unittest discover -s images/camofox/tests -p 'test_*.py' -v

    - name: Check immutable checkout and native runner architecture
      shell: bash
      run: |
        set -euo pipefail
        test "$(git -C upstream-camofox rev-parse HEAD)" = "$SOURCE_REVISION"
        test "$(python3 -I -c 'import runpy; print(runpy.run_path(".github/scripts/resolve_camofox_inputs.py")["source_revision"]())')" = "$SOURCE_REVISION"
        case "$(uname -m):$ARCH" in
          x86_64:amd64|aarch64:arm64) ;;
          *) printf 'Runner architecture does not match %s\n' "$ARCH" >&2; exit 1 ;;
        esac

    - name: Stage reviewed packaging helpers in upstream build context
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p upstream-camofox/.container-images/
        cp images/camofox/build_overlay.py images/camofox/policy.json \
          images/camofox/tests/verify_image.py upstream-camofox/.container-images/

    - name: Build source recipe from immutable inputs
      shell: bash
      run: |
        set -euo pipefail
        docker build --pull --no-cache --progress=plain \
          --platform "linux/$ARCH" \
          --build-arg NODE_IMAGE="$NODE_PIN" \
          --label org.opencontainers.image.source=https://github.com/home-containers/container-images \
          --label org.opencontainers.image.revision="$GITHUB_SHA" \
          --label io.camofox.upstream.revision="$SOURCE_REVISION" \
          --file images/camofox/Dockerfile \
          --tag "$TEST_IMAGE" upstream-camofox

    - name: Verify immutable source files and known startup contract
      shell: bash
      run: |
        set -euo pipefail
        docker image inspect "$TEST_IMAGE" > "$RUNNER_TEMP/camofox-inspect.json"
        container="$(docker create --network none "$TEST_IMAGE")"
        trap 'docker rm "$container" >/dev/null' EXIT
        docker cp "$container:/app/." - > "$RUNNER_TEMP/camofox-app.tar"
        python3 -B -I .github/scripts/verify_camofox_source.py \
          --source upstream-camofox --app-tar "$RUNNER_TEMP/camofox-app.tar" \
          --image-inspect "$RUNNER_TEMP/camofox-inspect.json" --arch "$ARCH" \
          --packaging-revision "$GITHUB_SHA" --source-revision "$SOURCE_REVISION"

    - name: Record measured native image layers
      shell: bash
      run: |
        set -euo pipefail
        docker history --no-trunc --human=false --format '{{json .}}' "$TEST_IMAGE" > "$RUNNER_TEMP/camofox-history.jsonl"
        python3 -I - <<'PY'
        import json, os
        from pathlib import Path
        rows = [json.loads(row) for row in (Path(os.environ['RUNNER_TEMP']) / 'camofox-history.jsonl').read_text().splitlines()]
        total = sum(int(row['Size']) for row in rows)
        report = {'arch': os.environ['ARCH'], 'uncompressed_layer_bytes': total,
                  'largest_layers': sorted((int(row['Size']) for row in rows), reverse=True)[:5]}
        print(json.dumps(report, sort_keys=True))
        with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
            summary.write(f"Native {os.environ['ARCH']} uncompressed layer bytes: `{total}`\n")
        PY

    - name: Verify patched libraries without networking
      shell: bash
      run: |
        set -euo pipefail
        docker run --rm --network none --entrypoint /usr/bin/python3 \
          "$TEST_IMAGE" -B -I /usr/local/share/camofox-build/verify_image.py

    - name: Exercise authenticated browser and persistent runtime contracts
      shell: bash
      run: |
        set -euo pipefail
        python3 images/camofox/tests/runtime_smoke.py --image "$TEST_IMAGE"
