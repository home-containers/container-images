name: Publish Camofox upstream recipe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: camofox-publish
  cancel-in-progress: false

jobs:
  resolve:
    if: github.repository == 'home-containers/container-images' && github.ref == 'refs/heads/main'
    name: Resolve immutable source and Node inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      source_revision: ${{ steps.inputs.outputs.source_revision }}
      node_pin: ${{ steps.inputs.outputs.node_pin }}
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Resolve fixed Node index and approved source once per run
        id: inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 -I .github/scripts/resolve_camofox_inputs.py

  native:
    if: github.repository == 'home-containers/container-images' && github.ref == 'refs/heads/main'
    name: Accept and publish native image (${{ matrix.arch }})
    needs: resolve
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      IMAGE: ghcr.io/home-containers/camofox-browser
      ARCH: ${{ matrix.arch }}
      SOURCE_REVISION: ${{ needs.resolve.outputs.source_revision }}
      NODE_PIN: ${{ needs.resolve.outputs.node_pin }}
      TEST_IMAGE: camofox-upstream-recipe:ci
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Check out immutable upstream source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: jo-inc/camofox-browser
          ref: ${{ needs.resolve.outputs.source_revision }}
          path: upstream-camofox
          persist-credentials: false
      - name: Accept the native image
        uses: ./.github/actions/camofox-accept

      - name: Authenticate only after all acceptance gates
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Publish and read back the exact tested image
        shell: bash
        run: |
          set -euo pipefail
          tag="$IMAGE:build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${ARCH}"
          tested_id="$(docker image inspect "$TEST_IMAGE" --format '{{.Id}}')"
          docker tag "$TEST_IMAGE" "$tag"
          docker push "$tag"
          docker pull "$tag"
          test "$(docker image inspect "$tag" --format '{{.Id}}')" = "$tested_id"
          docker run --rm --network none --entrypoint /usr/bin/python3 \
            "$tag" -B -I /usr/local/share/camofox-build/verify_image.py
          printf 'Published and read back: `%s`\nSource: `%s`\nUpstream source: `%s`\nNode: `%s`\n' \
            "$tag" "$GITHUB_SHA" "$SOURCE_REVISION" "$NODE_PIN" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove registry login
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          docker logout ghcr.io

  index:
    if: github.repository == 'home-containers/container-images' && github.ref == 'refs/heads/main'
    name: Publish and verify multiarchitecture index
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/home-containers/camofox-browser
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Authenticate after native matrix acceptance and readback
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Assemble and verify candidate before stable promotion
        shell: bash
        run: |
          set -euo pipefail
          version="build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker buildx imagetools create --tag "$IMAGE:$version" \
            "$IMAGE:${version}-arm64" "$IMAGE:${version}-amd64"
          docker buildx imagetools inspect "$IMAGE:$version" --format '{{json .Manifest}}' > "$RUNNER_TEMP/camofox-index.json"
          digest="$(python3 -I .github/scripts/verify_hermes_index.py < "$RUNNER_TEMP/camofox-index.json")"
          docker buildx imagetools create --tag "$IMAGE:stable" "$IMAGE@$digest"
          docker buildx imagetools inspect "$IMAGE:stable" --format '{{json .Manifest}}' > "$RUNNER_TEMP/camofox-stable.json"
          stable_digest="$(python3 -I .github/scripts/verify_hermes_index.py < "$RUNNER_TEMP/camofox-stable.json")"
          test "$stable_digest" = "$digest"
          printf 'Published `%s:%s` and `%s:stable`\n\nIndex: `%s@%s`\n\nSource: `%s`\n' \
            "$IMAGE" "$version" "$IMAGE" "$IMAGE" "$digest" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove registry login
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          docker logout ghcr.io
